name: Weekly Toddler Events Digest

on:
  schedule:
    # Thursday 22:00 UTC ≈ 6:00 PM US Eastern (adjust for your timezone/DST)
    - cron: "0 22 * * 4"
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build config.yaml from repo variables + secrets
        run: |
          cat > config.yaml << EOF
          location:
            city: "${{ vars.EVENT_CITY }}"
            state: "${{ vars.EVENT_STATE }}"
            radius: ${{ vars.EVENT_RADIUS || 15 }}
          ticketmaster:
            api_key: "${{ secrets.TICKETMASTER_API_KEY }}"
            classification: "Miscellaneous,Family"
          feeds: []
          child_age_range: "${{ vars.CHILD_AGE_RANGE || '1-3 years old (toddler)' }}"
          email:
            to: "${{ secrets.DIGEST_EMAIL_TO }}"
            from_name: "Weekend Events Digest"
          max_events: 8
          EOF

      - name: Run digest pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py
